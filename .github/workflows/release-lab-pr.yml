name: LAB - Verificar PR
on:
  pull_request:
    branches:
      - main
      - 'release/**'
permissions:
  contents: read
concurrency:
  group: release-lab-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Flutter analyze e test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout das ferramentas da base revisada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout da combinação proposta pelo PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false
      - name: Instalar Flutter fixado na candidata
        uses: ./trusted/.github/actions/setup-flutter
        with:
          build-inputs: app/delivery/build-inputs.json
      - name: Verificar aplicativo
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Verificar contratos e bloqueios da esteira
        working-directory: app
        run: python3 -m unittest discover -s tests/delivery -v
      - name: Explicar o alcance das verificações
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Verificar PR\n\nFlutter analyze, Flutter test e testes dos contratos da esteira concluídos.\n\n')
              summary.write('Revisão técnica continua humana. Este check não prepara RC, não pede avais e não distribui o aplicativo.\n')
          PY
