name: Slack - Preparar candidata
run-name: Slack - ${{ inputs.version }} / ${{ inputs.title }}
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Escopo congelado; GitHub TESTE exige habilitação própria
        type: choice
        options: [none, github_test]
        default: none
      version:
        description: Versão experimental, sem prefixo nem RC
        type: string
        required: true
      title:
        description: Mudança que os revisores vão conferir
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: poc-slack-candidate
  cancel-in-progress: false
env:
  POC_SOURCE_BRANCH: ${{ vars.POC_SOURCE_BRANCH || 'slack-main' }}
  POC_SLACK_ENABLED: ${{ vars.POC_SLACK_ENABLED }}
jobs:
  prepare:
    if: vars.POC_SLACK_ENABLED == 'true' && github.ref == format('refs/heads/{0}', vars.POC_SOURCE_BRANCH || 'slack-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: poc-slack-cut
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.candidate_tag }}
      source: ${{ steps.prepare.outputs.source_sha }}
      tooling: ${{ steps.prepare.outputs.tooling_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        name: Congelar candidata no namespace de teste
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          SCOPE: ${{ inputs.scope }}
          POC_SUPABASE_URL: ${{ vars.POC_SUPABASE_URL }}
          POC_REGISTRATION_SECRET: ${{ secrets.POC_REGISTRATION_SECRET }}
        run: python3 tools/delivery/poc_slack.py prepare --version "$VERSION" --title "$TITLE" --scope "$SCOPE" --output "$RUNNER_TEMP/poc-prepare"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: poc-preparation
          path: ${{ runner.temp }}/poc-prepare/
          retention-days: 90
          if-no-files-found: ignore
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: ./trusted/.github/actions/setup-flutter
        with:
          build-inputs: app/delivery/build-inputs.json
      - name: Testar aplicativo sem token de escrita
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Compilar preview do código congelado
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source }}
        run: python3 trusted/deploy/pages_preview.py build --repo app --source-sha "$SOURCE_SHA" --site "$RUNNER_TEMP/poc-new-site" > "$RUNNER_TEMP/poc-build.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: poc-built-preview
          path: ${{ runner.temp }}/poc-new-site/
          retention-days: 90
  web:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same Pages lock as the original flow. No shared delivery-state lock.
    concurrency:
      group: pages-preview
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: poc-built-preview
          path: ${{ runner.temp }}/poc-incoming
      - name: Recuperar e importar histórico estático sem sobrescrever
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source }}
        run: |
          python3 trusted/deploy/pages_preview.py history --site "$RUNNER_TEMP/poc-site"
          python3 trusted/tools/delivery/preview_retention.py --site "$RUNNER_TEMP/poc-site" --incoming "$RUNNER_TEMP/poc-incoming" --output "$RUNNER_TEMP/poc-retention" --apply
          python3 trusted/tools/delivery/issue_preview.py --incoming "$RUNNER_TEMP/poc-incoming" --site "$RUNNER_TEMP/poc-site" --source-sha "$SOURCE_SHA" > "$RUNNER_TEMP/poc-metadata.json"
          python3 trusted/deploy/pages_preview.py persist --site "$RUNNER_TEMP/poc-site"
          python3 trusted/deploy/pages_preview.py export --site "$RUNNER_TEMP/poc-site" --output "$RUNNER_TEMP/poc-public"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/poc-public
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Confirmar arquivos e identidade pelo link publicado
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'trusted/deploy')
          import pages_smoke
          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'poc-metadata.json').read_text())
          report = pages_smoke.verify(os.environ['SOURCE_SHA'], metadata['web_content_sha256'], metadata['snapshot_manifest_sha256'])
          Path(os.environ['RUNNER_TEMP'], 'poc-smoke.json').write_text(json.dumps(report))
          PY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: poc-web-proof
          path: |
            ${{ runner.temp }}/poc-metadata.json
            ${{ runner.temp }}/poc-smoke.json
            ${{ runner.temp }}/poc-retention/preview-retention.json
          retention-days: 90
          if-no-files-found: ignore
  open:
    needs: [prepare, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: poc-slack-cut
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.tooling }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: poc-web-proof
          path: ${{ runner.temp }}/poc-web-proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: poc-preparation
          path: ${{ runner.temp }}/poc-plan
      - name: Registrar candidata e confirmar recibo do cartão
        env:
          GH_TOKEN: ${{ github.token }}
          POC_SUPABASE_URL: ${{ vars.POC_SUPABASE_URL }}
          POC_REGISTRATION_SECRET: ${{ secrets.POC_REGISTRATION_SECRET }}
        run: python3 tools/delivery/poc_slack.py register --plan "$RUNNER_TEMP/poc-plan/candidate-plan.json" --metadata "$RUNNER_TEMP/poc-web-proof/poc-metadata.json" --smoke "$RUNNER_TEMP/poc-web-proof/poc-smoke.json" --output "$RUNNER_TEMP/poc-open"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: poc-candidate-report
          path: ${{ runner.temp }}/poc-open/
          retention-days: 90
          if-no-files-found: ignore
