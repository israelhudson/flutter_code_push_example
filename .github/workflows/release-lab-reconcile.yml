name: LAB - Consolidar execução encerrada
on:
  workflow_run:
    workflows: ['LAB - Preparar candidata', 'LAB - Avaliar entrega']
    types: [completed]
permissions:
  contents: read
jobs:
  observe:
    name: Registrar resultado oficial — sem efeitos de publicação
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-lab-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      # workflow_run can run after cancellation when a job in the cancelled
      # workflow could not start. Never download its artifacts or execute app code.
      - name: Checkout exclusivo das ferramentas confiáveis da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: refs/heads/main
          path: trusted
          persist-credentials: false
      - name: Vincular a observação à candidata e ao run original registrados
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 trusted/tools/delivery/release_lab.py reconcile-run --evaluation-run-id "$EVALUATION_RUN_ID" --output "$RUNNER_TEMP/release-lab-status"
      - name: Preservar o estado observado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-reconciled-status
          path: ${{ runner.temp }}/release-lab-status/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  notify:
    name: Avisar resultado original — Slack opcional
    needs: observe
    if: ${{ !cancelled() && needs.observe.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
      evaluation_run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      tooling_sha: refs/heads/main
      notification_label: observer
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
