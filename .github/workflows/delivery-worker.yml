name: Entrega v2 - Recuperar operações
on:
  workflow_dispatch:
    inputs:
      cancel_candidate:
        description: Opcional — cancelar candidata antes de iniciar a publicação
        type: string
        required: false
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
concurrency:
  group: delivery-v2-outbox
  cancel-in-progress: false
jobs:
  drain:
    if: vars.DELIVERY_V2_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      DELIVERY_V2_ENABLED: ${{ vars.DELIVERY_V2_ENABLED }}
      POC_SUPABASE_URL: ${{ vars.POC_SUPABASE_URL }}
      POC_SOURCE_BRANCH: ${{ vars.DELIVERY_SOURCE_BRANCH || 'main' }}
      POC_REGISTRATION_SECRET: ${{ secrets.POC_REGISTRATION_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirmar evidências e entregar operações pendentes
        env:
          CANCEL_CANDIDATE: ${{ inputs.cancel_candidate }}
        run: |
          args=()
          if [ -n "$CANCEL_CANDIDATE" ]; then args+=(--cancel "$CANCEL_CANDIDATE"); fi
          python3 tools/delivery/delivery_v2.py drain --output "$RUNNER_TEMP/delivery-worker" "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-worker-receipts
          path: ${{ runner.temp }}/delivery-worker/
          retention-days: 90
