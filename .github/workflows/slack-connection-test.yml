name: LAB - Testar conexão Slack
on:
  push:
    branches: [codex/slack-connection-test]
    paths: [.github/workflows/slack-connection-test.yml]
permissions:
  contents: read
jobs:
  test:
    if: github.actor == 'israelhudson' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar bot e canal privado; enviar uma mensagem de teste
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/slack-proof"
          python3 tools/delivery/slack_notify.py --send --event lab \
            --status 'Teste de conexão: este aviso foi enviado pelo bot através do GitHub Actions. Aprovações e publicação continuam exclusivamente no GitHub. Os avisos automáticos de cada candidata ainda precisam ser integrados.' \
            --candidate TESTE-CONEXAO-SLACK --source-sha "$SOURCE_SHA" \
            --url "$RUN_URL" --idempotency-key "connection-test:$RUN_ID" \
            --outbox "$RUNNER_TEMP/slack-proof/outbox.sqlite3" \
            > "$RUNNER_TEMP/slack-proof/receipt.json"
          cat "$RUNNER_TEMP/slack-proof/receipt.json"
          cat "$RUNNER_TEMP/slack-proof/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar recibo e estado do envio sem credenciais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slack-connection-proof
          path: ${{ runner.temp }}/slack-proof/
          if-no-files-found: ignore
          retention-days: 30
