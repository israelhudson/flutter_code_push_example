name: LAB - Avaliar entrega
run-name: Avaliar ${{ inputs.candidate_tag || github.ref_name }}
on:
  workflow_call:
    inputs:
      candidate_tag:
        description: RC já preparada e registrada internamente
        type: string
        required: true
    secrets:
      SLACK_BOT_TOKEN:
        description: Bot de avisos do canal privado LAB; opcional
        required: false
  push:
    tags:
      - 'v*-rc.*'
permissions:
  contents: read
concurrency:
  group: release-lab-evaluate-${{ inputs.candidate_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Conferir RC ativa, papéis e proteções
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      candidate_tag: ${{ steps.identity.outputs.candidate_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tooling_sha: ${{ steps.identity.outputs.tooling_sha }}
      first_environment: ${{ steps.identity.outputs.first_environment }}
      second_environment: ${{ steps.identity.outputs.second_environment }}
      final_environment: ${{ steps.identity.outputs.final_environment }}
      first_login: ${{ steps.identity.outputs.first_login }}
      second_login: ${{ steps.identity.outputs.second_login }}
    steps:
      - name: Checkout das ferramentas confiáveis da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: refs/heads/main
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Vincular uma única avaliação à candidata
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag || github.ref_name }}
        run: python3 trusted/tools/delivery/release_lab.py preflight --candidate-tag "$CANDIDATE_TAG" --output "$RUNNER_TEMP/release-lab"
      - name: Preservar identidade verificada
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-preflight
          path: ${{ runner.temp }}/release-lab/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  build:
    name: Verificar e compilar web sem permissões de publicação
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout das ferramentas confiáveis congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exato do aplicativo aprovado para avaliação
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Flutter fixado no snapshot
        uses: ./trusted/.github/actions/setup-flutter
        with:
          build-inputs: app/delivery/build-inputs.json
      - name: Flutter analyze e Flutter test
        working-directory: app
        # No write token is exposed to application or dependency code.
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Compilar snapshot web sem histórico ou credenciais
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
        run: python3 trusted/deploy/pages_preview.py build --repo app --source-sha "$SOURCE_SHA" --delivery-tag "$CANDIDATE_TAG" --site "$RUNNER_TEMP/new-pages-site" > "$RUNNER_TEMP/pages-build-metadata.json"
      - name: Entregar somente bytes compilados para outro runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-built-web
          path: ${{ runner.temp }}/new-pages-site/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
  changelog_context:
    name: Preparar contexto do changelog — opcional, sem aguardar IA
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout das ferramentas confiáveis congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Ler a identidade da mesma candidata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: release-lab-preflight
          path: ${{ runner.temp }}/context-input
      - name: Congelar descrições de PRs; nenhuma chamada de IA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/delivery/changelog_summary.py --collect-candidate "$RUNNER_TEMP/context-input/candidate.json" --repo trusted --output "$RUNNER_TEMP/changelog-context"
      - name: Preservar contexto auxiliar sem atrasar o caminho obrigatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-context
          path: ${{ runner.temp }}/changelog-context/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  web:
    name: Publicar bytes verificados, confirmar preview e changelog
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A fresh runner never executes candidate/dependency code with write or
    # OIDC privileges. Only validated static bytes cross the job boundary.
    # This lock covers Pages work, not the wait for human approvals.
    concurrency:
      group: pages-preview
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.report.outputs.preview_url }}
    outputs:
      report_digest: ${{ steps.report.outputs.report_digest }}
      report_url: ${{ steps.report.outputs.report_url }}
      preview_url: ${{ steps.report.outputs.preview_url }}
    steps:
      - name: Checkout exclusivo das ferramentas confiáveis congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Receber artefato estático da mesma execução
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: release-lab-built-web
          path: ${{ runner.temp }}/incoming-site
      - name: Recuperar somente o histórico estático
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/deploy/pages_preview.py history --site "$RUNNER_TEMP/pages-site"
      - name: Validar identidade e importar sem sobrescrever snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
        run: python3 trusted/tools/delivery/release_lab.py merge-preview --candidate-tag "$CANDIDATE_TAG" --incoming "$RUNNER_TEMP/incoming-site" --site "$RUNNER_TEMP/pages-site" --output "$RUNNER_TEMP/release-lab"
      - name: Preservar snapshots sem sobrescrever
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/deploy/pages_preview.py persist --site "$RUNNER_TEMP/pages-site"
      - name: Exportar somente o site estático
        run: python3 trusted/deploy/pages_preview.py export --site "$RUNNER_TEMP/pages-site" --output "$RUNNER_TEMP/pages-public"
      - name: Empacotar artefato Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0, Node 24
        with:
          path: ${{ runner.temp }}/pages-public
          retention-days: 1
      - name: Publicar preview no Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1, Node 24
      - name: Ler identidade dos bytes preparados
        id: web_identity
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-lab', 'preview-metadata.json').read_text())
          keys = ('web_content_sha256', 'snapshot_manifest_sha256')
          if metadata['source_sha'] != os.environ['SOURCE_SHA'] or any(not re.fullmatch(r'[0-9a-f]{64}', metadata[key]) for key in keys):
              raise ValueError('Metadata não corresponde à fonte congelada.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in keys:
                  output.write(key + '=' + metadata[key] + '\n')
          PY
      - name: Confirmar identidade e arquivos por HTTP
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          WEB_CONTENT_SHA256: ${{ steps.web_identity.outputs.web_content_sha256 }}
          SNAPSHOT_MANIFEST_SHA256: ${{ steps.web_identity.outputs.snapshot_manifest_sha256 }}
        run: python3 trusted/deploy/pages_smoke.py --source-sha "$SOURCE_SHA" --expected-web-content-sha256 "$WEB_CONTENT_SHA256" --expected-snapshot-manifest-sha256 "$SNAPSHOT_MANIFEST_SHA256" --output "$RUNNER_TEMP/pages-smoke.json"
      - name: Registrar changelog, previsão e preview antes dos avais
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
        run: python3 trusted/tools/delivery/release_lab.py report --candidate-tag "$CANDIDATE_TAG" --preview-report "$RUNNER_TEMP/pages-smoke.json" --preview-metadata "$RUNNER_TEMP/release-lab/preview-metadata.json" --context-artifact release-lab-context --output "$RUNNER_TEMP/release-lab"
      - name: Preservar relatório e confirmação HTTP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-evaluation
          path: |
            ${{ runner.temp }}/release-lab/
            ${{ runner.temp }}/pages-smoke.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  approve_first:
    name: Registrar aprovação — ${{ needs.preflight.outputs.first_login }} / Gate first
    needs: [preflight, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    environment:
      name: ${{ needs.preflight.outputs.first_environment }}
      url: ${{ needs.web.outputs.report_url }}
    steps:
      - name: Checkout das ferramentas congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          persist-credentials: false
      - name: Confirmar primeira conta autorizada, relatório e RC ainda ativa
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
          REPORT_DIGEST: ${{ needs.web.outputs.report_digest }}
        run: python3 trusted/tools/delivery/release_lab.py approval --candidate-tag "$CANDIDATE_TAG" --report-digest "$REPORT_DIGEST" --role first --output "$RUNNER_TEMP/release-lab"
      - name: Preservar evidência do primeiro aval
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-approval-first
          path: ${{ runner.temp }}/release-lab/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  approve_second:
    name: Registrar aprovação — ${{ needs.preflight.outputs.second_login }} / Gate second
    needs: [preflight, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    environment:
      name: ${{ needs.preflight.outputs.second_environment }}
      url: ${{ needs.web.outputs.report_url }}
    steps:
      - name: Checkout das ferramentas congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          persist-credentials: false
      - name: Confirmar segunda conta autorizada, relatório e RC ainda ativa
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
          REPORT_DIGEST: ${{ needs.web.outputs.report_digest }}
        run: python3 trusted/tools/delivery/release_lab.py approval --candidate-tag "$CANDIDATE_TAG" --report-digest "$REPORT_DIGEST" --role second --output "$RUNNER_TEMP/release-lab"
      - name: Preservar evidência do segundo aval
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-approval-second
          path: ${{ runner.temp }}/release-lab/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  close_rejected_first:
    name: Encerrar rejeição de Israel — sem aprovar ou publicar
    needs: [preflight, approve_first]
    # A rejection must close the run even when the other gate is still waiting.
    # Technical job failure alone never authorizes cancellation in the helper.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.approve_first.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-lab-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout das ferramentas confiáveis atuais da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: refs/heads/main
          path: trusted
          persist-credentials: false
      - name: Registrar rejeição oficial e fechar somente este run original
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/delivery/release_lab.py reconcile-run --evaluation-run-id "$GITHUB_RUN_ID" --close-rejected-run --output "$RUNNER_TEMP/release-lab-rejection-first"
      - name: Preservar diagnóstico do fechamento
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-rejection-first
          path: ${{ runner.temp }}/release-lab-rejection-first/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  close_rejected_second:
    name: Encerrar rejeição de Fabrícia — sem aprovar ou publicar
    needs: [preflight, approve_second]
    # A rejection must close the run even when the other gate is still waiting.
    # Technical job failure alone never authorizes cancellation in the helper.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.approve_second.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-lab-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout das ferramentas confiáveis atuais da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: refs/heads/main
          path: trusted
          persist-credentials: false
      - name: Registrar rejeição oficial e fechar somente este run original
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/delivery/release_lab.py reconcile-run --evaluation-run-id "$GITHUB_RUN_ID" --close-rejected-run --output "$RUNNER_TEMP/release-lab-rejection-second"
      - name: Preservar diagnóstico do fechamento
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-rejection-second
          path: ${{ runner.temp }}/release-lab-rejection-second/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  authorize_publish:
    name: AUTORIZAR PUBLICAR — Israel OU Fabrícia, após os dois avais
    needs: [preflight, web, approve_first, approve_second]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: ${{ needs.preflight.outputs.final_environment }}
      url: ${{ needs.web.outputs.report_url }}
    steps:
      - name: Registrar autorização final da conta para a promoção
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Comando final autorizado\n\n')
              summary.write('Este gate registra a decisão final separada dos dois avais. ')
              summary.write('O próximo job reconfere a candidata e as reviews antes de criar a tag estável e a Release no GitHub. ')
              summary.write('Nenhum aplicativo ou patch mobile será distribuído.\n')
          PY
  publish:
    name: PROMOVER — tag estável e Release no GitHub, sem distribuição mobile
    needs: [preflight, web, approve_first, approve_second, authorize_publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No Environment gate here: only the short effectful job owns the lock.
    # Prepare and recovery use the same group, so no cut can supersede this RC
    # between the last identity check and the tag/Release API writes.
    concurrency:
      group: release-lab-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout das ferramentas congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          persist-credentials: false
      - name: Reconferir 2 de 2 e comando final, promover a mesma RC no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.preflight.outputs.candidate_tag }}
          REPORT_DIGEST: ${{ needs.web.outputs.report_digest }}
        run: python3 trusted/tools/delivery/release_lab.py finish --candidate-tag "$CANDIDATE_TAG" --report-digest "$REPORT_DIGEST" --output "$RUNNER_TEMP/release-lab"
      - name: Preservar intenção, recibo e logs da promoção
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-publication
          path: ${{ runner.temp }}/release-lab/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  finalize_status:
    name: Consolidar resultado da candidata — sem aprovar ou publicar
    needs: [preflight, build, web, approve_first, approve_second, authorize_publish, publish]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-lab-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout das ferramentas confiáveis congeladas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ needs.preflight.outputs.tooling_sha }}
          path: trusted
          persist-credentials: false
      - name: Ler apenas o run e as reviews oficiais; consolidar o estado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/delivery/release_lab.py reconcile --evaluation-run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/release-lab-status"
      - name: Preservar estado observado e motivo do encerramento
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-final-status
          path: ${{ runner.temp }}/release-lab-status/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false

  slack_candidate:
    name: Avisar candidata pronta — Slack opcional
    needs: [preflight, web]
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
      candidate_tag: ${{ needs.preflight.outputs.candidate_tag }}
      tooling_sha: ${{ needs.preflight.outputs.tooling_sha }}
      notification_label: slack_candidate
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  slack_first:
    name: Avisar aval de Israel — Slack opcional
    needs: [preflight, web, approve_first]
    if: ${{ !cancelled() && needs.approve_first.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
      candidate_tag: ${{ needs.preflight.outputs.candidate_tag }}
      tooling_sha: ${{ needs.preflight.outputs.tooling_sha }}
      notification_label: slack_first
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  slack_second:
    name: Avisar aval de Fabrícia — Slack opcional
    needs: [preflight, web, approve_second]
    if: ${{ !cancelled() && needs.approve_second.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
      candidate_tag: ${{ needs.preflight.outputs.candidate_tag }}
      tooling_sha: ${{ needs.preflight.outputs.tooling_sha }}
      notification_label: slack_second
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  slack_ready:
    name: Avisar 2/2 e comando separado — Slack opcional
    needs: [preflight, web, approve_first, approve_second]
    if: ${{ !cancelled() && needs.approve_first.result == 'success' && needs.approve_second.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
      candidate_tag: ${{ needs.preflight.outputs.candidate_tag }}
      tooling_sha: ${{ needs.preflight.outputs.tooling_sha }}
      notification_label: slack_ready
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  slack_publication:
    name: Avisar resultado de promoção — Slack opcional
    needs: [preflight, publish]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'failure') }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
      candidate_tag: ${{ needs.preflight.outputs.candidate_tag }}
      tooling_sha: ${{ needs.preflight.outputs.tooling_sha }}
      notification_label: slack_publication
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  slack_final_status:
    name: Avisar encerramento — Slack opcional
    needs: [preflight, finalize_status]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && needs.finalize_status.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lab-slack.yml
    with:
