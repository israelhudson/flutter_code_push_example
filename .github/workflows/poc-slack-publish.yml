name: Slack - Publicar teste aprovado
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: ID congelado no Supabase; rerun usa o mesmo run para recuperar efeitos parciais
        type: string
        required: true
      finalize_existing:
        description: Corrigir apenas a apresentação de Release já publicada (sem republicar nem mover tags)
        type: boolean
        default: false
permissions:
  contents: read
env:
  POC_SOURCE_BRANCH: ${{ vars.POC_SOURCE_BRANCH || 'slack-main' }}
  POC_SLACK_ENABLED: ${{ vars.POC_SLACK_ENABLED }}
  POC_SLACK_PUBLISH_ENABLED: ${{ vars.POC_SLACK_PUBLISH_ENABLED }}
jobs:
  publish:
    name: Publicar GitHub TESTE e salvar recibo
    if: vars.POC_SLACK_ENABLED == 'true' && vars.POC_SLACK_PUBLISH_ENABLED == 'true' && github.ref == format('refs/heads/{0}', vars.POC_SOURCE_BRANCH || 'slack-main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: poc-slack-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconferir aceites e usar somente o SHA congelado
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          FINALIZE_EXISTING: ${{ inputs.finalize_existing }}
          POC_SUPABASE_URL: ${{ vars.POC_SUPABASE_URL }}
          POC_PUBLICATION_SECRET: ${{ secrets.POC_PUBLICATION_SECRET }}
        run: |
          args=()
          if [ "$FINALIZE_EXISTING" = "true" ]; then args+=(--finalize-existing); fi
          python3 tools/delivery/poc_slack.py publish --candidate "$CANDIDATE" --output "$RUNNER_TEMP/poc-publication" "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: poc-publication-receipts
          path: ${{ runner.temp }}/poc-publication/
          retention-days: 90
          if-no-files-found: ignore
