name: LAB · Criar candidata
run-name: Preparar ${{ inputs.version }} — ${{ inputs.title }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão da entrega, por exemplo 1.4.0 (sem v ou rc)
        type: string
        required: true
      title:
        description: Título que aparecerá no changelog da candidata
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    name: Criar branch e tag da candidata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The same short lock protects cutting, promoting and recovering a release.
    # It ends when this cut completes; approval jobs never hold it.
    concurrency:
      group: release-lab-mutation
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      tooling_sha: ${{ steps.candidate.outputs.tooling_sha }}
    steps:
      - name: Checkout das ferramentas confiáveis da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: refs/heads/main
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Criar branch release e tag RC imutável com identidade interna
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: python3 trusted/tools/delivery/release_lab.py prepare --version "$RELEASE_VERSION" --title "$RELEASE_TITLE" --output "$RUNNER_TEMP/release-lab"
      - name: Preservar registro do corte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: release-lab-preparation
          path: ${{ runner.temp }}/release-lab/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
  evaluate:
    name: Validar e revisar candidata
    needs: prepare
    permissions:
      contents: write
      actions: write
      pull-requests: read
      pages: write
      id-token: write
    # GITHUB_TOKEN tag pushes do not start another push workflow. Calling the
    # reusable evaluator explicitly avoids relying on that suppressed event.
    uses: ./.github/workflows/release-lab-evaluate.yml
    with:
      candidate_tag: ${{ needs.prepare.outputs.candidate_tag }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
